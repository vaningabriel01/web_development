<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
        <h1 class="form-title">Sistema de Acesso</h1>
    
    <p class="form-description">Bem-vindo ao sistema. Por favor, insira suas credenciais para continuar.</p>

    <form class="form-container" action="./php/index.php" method="POST">
        <div class="form-group">
            <label for="login">Login:</label>
            <input type="text" id="login" name="login" class="form-input" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" class="form-input" required>
        </div>

        <button type="submit" class="form-button">Entrar</button>

    </form>
</body>
</html>
