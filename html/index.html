<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">     
    <script src="../script.js"></script>
    <title>Cadastro</title>
</head>
<body>
    <header class="bg-primary text-white p-4 text-center">
        <h1 class="fw-bold">Cadastro de Usuário</h1>
    </header>
    
    <nav class="navbar">
        <div class="nav">
            <ul class="navbar-menu">
                <li><a class="navbar-link" href="./index.html">Home</a></li>
                <li><a class="navbar-link" href="./sobre.html">Sobre</a></li>
                <li><a class="navbar-link" href="./contato.html">Contato</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <form class="form" method="get" onsubmit=" return validarForm()">
            <div class="form-group">
                <label class="label" for="name">Nome: </label>
                <input type="text" id="name" name="name" class="form-control">
            </div>

            <div class="form-group">
                <label class="label" for="cpf">CPF: </label>
                <input type="text" id="cpf" name="cpf" class="form-control">
            </div>
            <div class="form-group">
                <label class="label" for="email">Email: </label>
                <input type="email" id="email" name="email" class="form-control">
            </div>
            <div class="form-group">
                <label class="label" for="senha">Senha: </label>
                <input type="password" id="senha" name="senha" class="form-control">
            </div>
            <div class="form-group">
                <label class="label" for="endereco">Endereço: </label>
                <input type="text" id="endereco" name="endereco" class="form-control">
            </div>

            <input type="submit" value="Cadastrar" class="btn btn-primary">

        </form>
    </div>





</body>
</html>
